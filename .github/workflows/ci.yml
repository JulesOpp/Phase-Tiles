name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The three platforms we ship.  Not macos-13: retired
        # 2025-12-04, a job asking for it queues for 24 h.
        os: [macos-14, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[gui,test]"
      - run: ruff check .
      - run: python -m pytest -q
      - name: selftest from the checkout
        run: python -m phasetilesapp.main --selftest checkout-selftest.png
      - name: image must exist
        shell: bash
        run: test -s checkout-selftest.png

  bundle:
    name: bundle · ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install ".[gui,build]"
      - name: build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm packaging/macos.spec
          "dist/Phase Tiles.app/Contents/MacOS/Phase Tiles" --selftest "$PWD/bundle-selftest.png"
          test -s bundle-selftest.png
          python packaging/makedmg.py
      - name: build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm packaging/windows.spec
          # console=False: no stdout, so judge by exit code and the PNG.
          $p = Start-Process "dist/Phase Tiles/Phase Tiles.exe" `
            -ArgumentList "--selftest","`"$PWD\bundle-selftest.png`"" `
            -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Test-Path bundle-selftest.png)) { exit 1 }
          $v = python -c "from importlib.metadata import version; print(version('phase-tiles'))"
          choco install innosetup -y --no-progress
          iscc /DAppVersion=$v packaging\phase-tiles.iss
      # Every run still builds and self-tests the bundle, but only a
      # tag (for the release job) or a manual run keeps the files
      # (~190 MB a run): the release page holds them for good.
      - uses: actions/upload-artifact@v4
        if: >-
          startsWith(github.ref, 'refs/tags/v')
          || github.event_name == 'workflow_dispatch'
        with:
          name: phase-tiles-${{ matrix.os }}
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*setup*.exe
            bundle-selftest.png

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: artifacts}
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*setup*.exe
